<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Card</title>

    <link rel="stylesheet" href="style11.css">
</head>
<body>

<div class="card">

    <img src="dot.png" alt="Course Image">

    <div class="content">

        <h2>Web Development Bootcamp</h2>

        <p class="teacher">
            Web Development Master
            <br>
            Course @dot Batch
        </p>

        <div class="price">

            <span class="new">₹4500</span>

            <span class="old">₹6999</span>

            <span class="offer">42% OFF</span>

        </div>

    </div>

</div>

</body>
</html>
